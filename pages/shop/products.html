<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm - Urban Vibe | Thời trang nữ đa dạng</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="image/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base/base.css">
<link rel="stylesheet" href="css/components/button.css">
<link rel="stylesheet" href="css/components/product-card.css">
<link rel="stylesheet" href="css/layout/header.css">
<link rel="stylesheet" href="css/layout/footer.css">
<link rel="stylesheet" href="css/layout/floating.css">
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/pages/listing.css">
<link rel="stylesheet" href="css/pages/product-detail.css">
<link rel="stylesheet" href="css/pages/cart.css">
<link rel="stylesheet" href="css/pages/collection.css">
<link rel="stylesheet" href="css/pages/black-friday.css">
<link rel="stylesheet" href="css/pages/info.css">
<link rel="stylesheet" href="css/pages/auth.css">
<link rel="stylesheet" href="css/pages/account.css">
</head>
<body data-nav="product">

<div id="site-header"></div>

<main class="site-main listing-page">
    <!-- Banner danh mục: ảnh rộng hết màn hình + thẻ kính mờ góc dưới trái (vẽ bởi js/pages/products.js) -->
    <section class="cat-hero" id="cat-hero">
        <img class="cat-hero-img" id="cat-hero-img" src="image/lookbook/for-her.webp" alt="" width="1920" height="729" fetchpriority="high" decoding="async">
        <div class="cat-hero-card">
            <h1 id="listing-title">Sản phẩm</h1>
            <p id="listing-desc">Thời trang nữ Urban Vibe: thiết kế thanh lịch, chất liệu dễ chịu, phù hợp đi làm lẫn dạo phố.</p>
        </div>
    </section>

    <div class="container listing-wrap">
        <nav class="breadcrumb" aria-label="Đường dẫn">
            <a href="index.html">Trang chủ</a>
            <span class="breadcrumb-sep"></span>
            <span class="breadcrumb-current" id="breadcrumb-current">Sản phẩm</span>
        </nav>

        <!-- Hàng nút pill nhóm sản phẩm -->
        <div class="cat-pills" id="category-tabs"></div>

        <div class="listing-layout" id="listing-layout">
            <!-- Cột lọc bên trái -->
            <aside class="filter-panel" id="filter-panel" aria-label="Bộ lọc">
                <div class="filter-head"><span>BỘ LỌC</span><button type="button" class="filter-close" onclick="productsPage.toggleFilters()" aria-label="Thu gọn bộ lọc"></button></div>
                <div class="filter-group open">
                    <button type="button" class="filter-title" onclick="productsPage.toggleGroup(this)">Nổi bật</button>
                    <div class="filter-body" id="filter-tags"></div>
                </div>
                <div class="filter-group open">
                    <button type="button" class="filter-title" onclick="productsPage.toggleGroup(this)">Khoảng giá</button>
                    <div class="filter-body" id="filter-prices"></div>
                </div>
            </aside>

            <!-- Khu sản phẩm -->
            <section class="listing-main">
                <div class="listing-toolbar">
                    <button type="button" class="filter-toggle" onclick="productsPage.toggleFilters()" aria-label="Ẩn / hiện bộ lọc"></button>
                    <span class="sort-count" id="sort-count"></span>
                    <div class="toolbar-right">
                        <div class="sort-select" id="sort-select">
                            <button type="button" class="sort-button" onclick="productsPage.toggleSort()"><span id="sort-label">Mới nhất</span></button>
                            <ul class="sort-menu" id="sort-menu"></ul>
                        </div>
                        <span class="view-label">Hiển thị</span>
                        <button type="button" class="view-btn" data-cols="3" onclick="productsPage.setCols(3)" aria-label="Lưới 3 cột"></button>
                        <button type="button" class="view-btn" data-cols="4" onclick="productsPage.setCols(4)" aria-label="Lưới 4 cột"></button>
                    </div>
                </div>
                <div class="product-grid" id="listing-grid"></div>
                <nav class="pagination" id="listing-pagination" aria-label="Phân trang"></nav>
            </section>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script defer src="js/data/products.js"></script>
<script defer src="js/data/collections.js"></script>
<script defer src="js/data/stores.js"></script>
<script defer src="js/data/mock-data.js"></script>
<script defer src="js/core/icons.js"></script>
<script defer src="js/core/utils.js"></script>
<script defer src="js/data/catalog.js"></script>
<script defer src="js/core/layout.js"></script>
<script defer src="js/core/auth.js"></script>
<script defer src="js/core/header.js"></script>
<script defer src="js/core/account-modal.js"></script>
<script defer src="js/features/wishlist.js"></script>
<script defer src="js/features/cart.js"></script>
<script defer src="js/features/orders.js"></script>
<script defer src="js/components/product-card.js"></script>
<script defer src="js/widgets/student-popup.js"></script>
<script defer src="js/pages/products.js"></script>
<script defer src="js/core/app.js"></script>

</body>
</html>
