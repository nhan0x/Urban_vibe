<body data-nav="product">

<div id="site-header"></div>

<main class="site-main page-plain">
    <!-- Tiêu đề + đường dẫn -->
    <div class="page-container listing-head">
        <h1 class="page-title" id="listing-title">Sản phẩm</h1>
        <nav class="breadcrumb" aria-label="Đường dẫn">
            <a href="index.html">Trang chủ</a>
            <span class="breadcrumb-sep"></span>
            <a href="pages/shop/products.html" id="breadcrumb-current">Sản phẩm</a>
        </nav>
    </div>

    <!-- Dải tab nhóm sản phẩm (vẽ bởi js/pages/products.js) -->
    <div class="category-band">
        <div class="page-container"><div class="category-tabs" id="category-tabs"></div></div>
    </div>

    <div class="page-container listing-body">
        <!-- Thanh sắp xếp -->
        <div class="sort-bar">
            <span class="sort-icon" aria-hidden="true"></span>
            <p>Sắp xếp theo</p>
            <div class="sort-select" id="sort-select">
                <button type="button" class="sort-button" id="sort-button" onclick="productsPage.toggleSort()"><span id="sort-label">Mới nhất</span></button>
                <ul class="sort-menu" id="sort-menu"></ul>
            </div>
            <span class="sort-count" id="sort-count"></span>
        </div>

        <div class="product-grid" id="listing-grid"></div>
        <nav class="pagination" id="listing-pagination" aria-label="Phân trang"></nav>
    </div>
</main>

<div id="site-footer"></div>
