<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuyển dụng - Urban Vibe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="image/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-nav="about">

<div id="site-header"></div>

<main class="site-main recruit-main">

    <div class="recruit-hero"><img src="image/lookbook/the-monochromes.jpg" alt="Đội ngũ Urban Vibe"></div>
    <section class="recruit-search">
        <h1>Tuyển dụng</h1>
        <form class="recruit-form" onsubmit="recruitPage.search(event)">
            <span class="recruit-input"><span class="recruit-input-icon" id="recruit-icon"></span><input type="text" id="job-keyword" placeholder="Tìm kiếm công việc" autocomplete="off"></span>
            <select id="job-group" class="recruit-select"></select>
            <button type="submit" class="btn btn-gray recruit-btn">Tìm kiếm</button>
        </form>
    </section>
    <section class="recruit-list-wrap">
        <div class="page-container recruit-list-inner">
            <h2>Việc làm nổi bật</h2>
            <div class="job-list" id="job-list"></div>
        </div>
    </section>
</main>

<div id="site-footer"></div>

<script src="js/data/products.js"></script>
<script src="js/data/collections.js"></script>
<script src="js/data/stores.js"></script>
<script src="js/data/blog.js"></script>
<script src="js/data/info-pages.js"></script>
<script src="js/data/mock-data.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/header.js"></script>
<script src="js/core/account-modal.js"></script>
<script src="js/features/wishlist.js"></script>
<script src="js/features/cart.js"></script>
<script src="js/features/orders.js"></script>
<script src="js/widgets/student-popup.js"></script>
<script src="js/pages/recruitment.js"></script>
<script src="js/core/app.js"></script>

</body>
</html>
