<title>Blog - Urban Vibe | Tạp chí thời trang</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400&display=swap&subset=vietnamese" rel="stylesheet">

<body data-nav="about">

<div id="site-header"></div>

<main class="site-main info-main">

    <div class="page-container blog-page">
        <div class="blog-top">
            <div class="blog-top-title"><h1>BLOG</h1><p>Chào mừng ghé thăm tạp chí Urban Vibe</p></div>
            <form class="blog-search" onsubmit="blogPage.search(event)">
                <span class="blog-search-box"><span class="blog-search-icon" id="blog-search-icon"></span><input type="text" id="blog-keyword" placeholder="Tìm kiếm bài viết" autocomplete="off"></span>
                <button type="submit" class="btn btn-outline btn-md">Tìm kiếm</button>
            </form>
        </div>
        <div class="blog-cats">
            <h2>Chuyên mục</h2>
            <div class="blog-cat-links" id="blog-cats"></div>
        </div>
        <div class="blog-list" id="blog-list"></div>
        <nav class="pagination" id="blog-pagination" aria-label="Phân trang"></nav>
    </div>
</main>

<div id="site-footer"></div>
